<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Athletic Shield / Court Base -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b8457" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background Sport Shield -->
  <path d="M50 8 L85 20 V50 C85 72 50 92 50 92 C50 92 15 72 15 50 V20 L50 8 Z" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Court Boundary Lines (Subtle White Court Markings) -->
  <path d="M28 32 H72 V68 H28 Z" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.8" stroke-dasharray="2 2" fill="none" />
  <line x1="28" y1="50" x2="72" y2="50" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.8" />
  <circle cx="50" cy="50" r="11" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.8" fill="none" />

  <!-- Dynamic Wi-Fi Waves with Sporty Angle -->
  <path d="M26 40 A34 34 0 0 1 74 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M34 49 A22 22 0 0 1 66 49" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M42 58 A10 10 0 0 1 58 58" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Energetic Ball / Pulse Center Dot -->
  <circle cx="50" cy="67" r="4.5" fill="url(#orangeAccent)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Star / Quality Badges on top -->
  <polygon points="50,15 52,19 56,19 53,22 54,26 50,23 46,26 47,22 44,19 48,19" fill="#ffb703" />
</svg>
