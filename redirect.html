<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghubungkan... - CourtZone Hotspot</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <script>
        function doRedirect() {
            setTimeout(function() {
                const isLocal = window.location.hostname === 'localhost' || 
                                window.location.hostname === '127.0.0.1' || 
                                window.location.protocol === 'file:';
                if (isLocal) {
                    window.location.href = "status.html";
                } else {
                    window.location.href = "$(link-redirect)";
                }
            }, 1800);
        }
    </script>
</head>
<body onload="doRedirect()">

<div class="arena-wrapper" style="margin-top: 40px;">
    <!-- Top Stadium Header -->
    <header class="stadium-topbar">
        <div class="brand-badge">
            <div class="brand-icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M2 12h20" stroke="currentColor" stroke-width="2"/>
                </svg>
            </div>
            <div class="brand-text-block">
                <span class="brand-title">COURT<span>ZONE</span></span>
                <span class="brand-subtitle">SPORT & HANGOUT HUB</span>
            </div>
        </div>
        <div class="live-match-chip">
            <span class="live-dot"></span>
            <span>CONNECTING</span>
        </div>
    </header>

    <!-- Portal Main Area -->
    <main class="portal-main" style="padding: 32px 18px; text-align: center;">
        <span class="court-zone-tag">TURBO CONNECTION</span>
        <h2 class="hero-title" style="margin-top: 10px;">MEMBUKA <span>AKSES LAPANGAN</span></h2>
        <p class="hero-desc" style="margin-bottom: 20px;">Menghubungkan perangkat Anda ke jaringan WiFi CourtZone...</p>

        <!-- Loading Dots -->
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p style="font-size: 11px; color: var(--text-dim); margin-top: 24px;">
            Jika Anda tidak dialihkan otomatis, <a href="status.html" style="color: var(--volt-neon); text-decoration: underline; font-weight: 700;">klik di sini</a>.
        </p>
    </main>

    <!-- Stadium Footer -->
    <footer class="stadium-footer">
        <span class="footer-hub-pill">🏟️ COURTZONE SPORT & COMMUNITY ARENA</span>
        <span class="footer-copy">&copy; 2026 CourtZone Hotspot. All Rights Reserved.</span>
    </footer>
</div>

</body>
</html>
