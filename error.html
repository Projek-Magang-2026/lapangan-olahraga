<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendala Koneksi - CourtZone Hotspot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="arena-wrapper" style="margin-top: 40px;">
    <!-- Top Stadium Header -->
    <header class="stadium-topbar">
        <div class="brand-badge">
            <div class="brand-icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M2 12h20" stroke="currentColor" stroke-width="2"/>
                </svg>
            </div>
            <div class="brand-text-block">
                <span class="brand-title">COURT<span>ZONE</span></span>
                <span class="brand-subtitle">SPORT & HANGOUT HUB</span>
            </div>
        </div>
        <div class="live-match-chip" style="color: #f87171; border-color: rgba(248, 113, 113, 0.3);">
            <span>ERROR</span>
        </div>
    </header>

    <!-- Portal Main Area -->
    <main class="portal-main" style="padding: 24px 18px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <span class="court-zone-tag" style="background-color: #ef4444; color: white;">AUTHENTICATION FAILED</span>
            <h2 class="hero-title" style="margin-top: 8px;">KONEKSI <span>GAGAL</span></h2>
            <p class="hero-desc">Terjadi kendala saat otentikasi login ke sistem CourtZone</p>
        </div>

        <div class="error-box" style="margin-bottom: 24px; flex-direction: column; align-items: flex-start;">
            <span style="font-size: 12px; font-weight: 800;">❌ Pesan Kesalahan:</span>
            <div style="margin-top: 4px; font-family: monospace; font-size: 11px; color: #fee2e2;">
                $(error-message)
            </div>
        </div>

        <a href="login.html" class="btn-volt-action">
            KEMBALI KE LOGIN
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </a>
    </main>

    <!-- Stadium Footer -->
    <footer class="stadium-footer">
        <span class="footer-hub-pill">🏟️ COURTZONE SPORT & COMMUNITY ARENA</span>
        <span class="footer-copy">&copy; 2026 CourtZone Hotspot. All Rights Reserved.</span>
    </footer>
</div>

</body>
</html>
